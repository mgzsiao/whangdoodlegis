[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldortho"
version = "1.0.1"
description = "Offline drone photo processing (orthomosaic, DSM, DTM, contours) for field teams"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "rasterio>=1.3.9", "pyproj>=3.6", "numpy>=1.26", "Pillow>=10.0",
                "contourpy>=1.2", "pyshp>=2.3", "scipy>=1.11", "shapely>=2.0", "pyogrio>=0.7"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.3"]

[project.scripts]
fieldortho-cli = "fieldortho.cli:main"

[project.gui-scripts]
fieldortho = "fieldortho.app:main"

[tool.setuptools.packages.find]
include = ["fieldortho*"]

[tool.setuptools.package-data]
fieldortho = ["resources/*"]
